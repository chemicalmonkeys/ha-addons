name: Higgins Edge
version: "0.2.2"
slug: higgins_edge
description: Connects this home to Higgins. Reads the home; executes only allowlisted commands (lights).
url: https://github.com/chemicalmonkeys/ha-addons
arch:
  - aarch64
  - amd64
image: ghcr.io/chemicalmonkeys/higgins-edge
init: false
startup: application
boot: auto
homeassistant_api: true
options:
  control_plane_url: ""
  edge_token: ""
schema:
  control_plane_url: url
  edge_token: password
